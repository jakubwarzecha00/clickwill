name: Clickwill
options:
  bundleIdPrefix: pl.jakubwarzecha
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  ITDBKit:
    path: ..
  # Updates over the network: Sparkle checks the release feed
  # on our server and installs only releases signed with our EdDSA key.
  # Pinned version: change it only deliberately, together with the pinned revision
  # the release script compares with what Xcode fetched.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  Clickwill:
    type: application
    platform: macOS
    # An explicit scheme - Tools/check.sh and the release script build with -scheme Clickwill.
    scheme: {}
    sources:
      - path: Clickwill
      - path: ../THIRD-PARTY-NOTICES
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
    dependencies:
      - package: ITDBKit
        product: ClickwillModel
      - package: ITDBKit
        product: ITDBKit
      - package: Sparkle
    info:
      path: Clickwill/Info.plist
      properties:
        CFBundleName: Clickwill
        CFBundleDisplayName: Clickwill
        # A free Mac release outside the App Store. Stage: alpha until 0.3.1, beta
        # since 0.4.0, "" at 1.0. The stage changes texts in the app, the DMG name
        # and the update channel name (both channels give the same free releases).
        # Every DMG gets a new CFBundleVersion - that is how we recognize the
        # version in a report.
        ClickwillReleaseStage: beta
        # The version is in the settings below (MARKETING_VERSION, CURRENT_PROJECT_VERSION),
        # so the release script can override it without editing this file.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle: the channel's release feed from the stage (beta -> /updates/beta.xml).
        # Checking once a day, without asking at first launch; only the app
        # version is sent (no system profile).
        SUFeedURL: "$(CLICKWILL_SITE_URL)/updates/$(CLICKWILL_UPDATE_CHANNEL).xml"
        # The feedback server for Send Feedback (POST /api/feedback).
        ClickwillSiteURL: "$(CLICKWILL_SITE_URL)"
        SUPublicEDKey: "$(CLICKWILL_SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
        # The EdDSA signature of the DMG is checked before extraction, not after.
        # It works for updates FROM this version on (the old app's Info.plist is what counts).
        # There is no signature on the feed itself (SURequireSignedFeed): the feed is assembled on
        # every request with links valid for an hour, so it cannot be signed in advance.
        SUVerifyUpdateBeforeExtraction: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Jakub Warzecha. Licensed under the GNU GPL, version 3."
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: pl.jakubwarzecha.clickwill
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Semantic Versioning since 0.2.0: always three numbers,
        # MINOR - a new or changed feature, PATCH - fixes only. The stage (alpha/beta)
        # is ClickwillReleaseStage, not part of the number. The build always grows by one.
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "16"
        # The website domain. Debug stays with the local server (npm run dev).
        CLICKWILL_SITE_URL: "https://clickwilldev.com"
        CLICKWILL_UPDATE_CHANNEL: beta
        CLICKWILL_SPARKLE_PUBLIC_KEY: "KgYtbuoaYVjY0JEsxqx2SrMe01bnJ7GNCSxwRalwJjY="
      configs:
        # Debug is signed ad hoc - see Clickwill/AdHocSigning.entitlements.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Clickwill/AdHocSigning.entitlements
          CLICKWILL_SITE_URL: "http://localhost:8787"
